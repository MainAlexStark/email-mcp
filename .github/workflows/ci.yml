name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Хранилище и кабинет тестируются против настоящей базы: без неё
    # эти тесты пропускаются, и CI молча проверял бы меньше, чем кажется.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      MAIL_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: gofmt -l . | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
